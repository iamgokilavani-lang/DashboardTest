<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Production-style SaaS management frontend with subscription analytics, user management, pricing plans, and revenue metrics.">
  <title>SaaSFortress &bull; Enterprise SaaS & Subscription Management Dashboard</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          </div>
          <span>SaaSFortress</span>
        </div>
        <span class="brand-badge">PRO</span>
      </div>

      <nav class="sidebar-nav" aria-label="Main Navigation">
        <div class="nav-section-title">Core Systems</div>
        <a href="#overview" class="nav-item active" data-view="overview" id="nav-overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Overview</span>
        </a>
        <a href="#users" class="nav-item" data-view="users" id="nav-users">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>User Management</span>
          <span class="nav-badge" id="badge-users-count">15</span>
        </a>
        <a href="#subscriptions" class="nav-item" data-view="subscriptions" id="nav-subscriptions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>Subscriptions</span>
          <span class="nav-badge" id="badge-subs-count">9</span>
        </a>
        <a href="#plans" class="nav-item" data-view="plans" id="nav-plans">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          <span>Pricing Plans</span>
        </a>

        <div class="nav-section-title">Telemetry & Financials</div>
        <a href="#usage" class="nav-item" data-view="usage" id="nav-usage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><activity><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></activity></svg>
          <span>Usage Analytics</span>
        </a>
        <a href="#revenue" class="nav-item" data-view="revenue" id="nav-revenue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span>Revenue Analytics</span>
        </a>
        <a href="#customers" class="nav-item" data-view="customers" id="nav-customers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Customer Accounts</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <!-- Quota Widget -->
        <div class="plan-usage-widget">
          <div class="usage-widget-header">
            <span>Enterprise Cluster</span>
            <span style="color: var(--accent-emerald);">Active</span>
          </div>
          <div class="usage-progress-bar">
            <div class="usage-progress-fill" style="width: 76%;"></div>
          </div>
          <div class="usage-widget-subtext">
            <span>Seats Occupancy</span>
            <strong>76% (38/50)</strong>
          </div>
        </div>

        <!-- User Profile Capsule -->
        <div class="user-capsule" id="current-user-capsule" title="Click to view workspace admin profile">
          <div class="avatar" style="background: linear-gradient(135deg, #4f46e5, #06b6d4);">
            GV
          </div>
          <div class="user-info">
            <div class="user-name">Gokilavani (You)</div>
            <div class="user-role">Super Admin &bull; Apex Corp</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Application Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button class="mobile-menu-btn" id="btn-toggle-sidebar" aria-label="Toggle navigation menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>

          <div class="global-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input
              type="text"
              class="search-input"
              id="global-quick-search"
              placeholder="Search users, subscriptions, or plans..."
              aria-label="Quick search"
            />
            <span class="search-shortcut">/</span>
          </div>
        </div>

        <div class="top-bar-right">
          <!-- Date Range Selector -->
          <div class="date-controls">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-tertiary); margin-left: 0.35rem;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <select class="date-preset-select" id="date-range-select" aria-label="Select date range filter">
              <option value="today">Today</option>
              <option value="7d">Last 7 Days</option>
              <option value="30d" selected>Last 30 Days</option>
              <option value="90d">Last 90 Days</option>
              <option value="ytd">Year to Date (YTD)</option>
              <option value="custom">Custom Range</option>
            </select>
            <button class="compare-toggle-btn active" id="btn-toggle-comparison" title="Toggle Comparison Analytics">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
              <span>Compare</span>
            </button>
          </div>

          <!-- Simulate Network Delay / Loading -->
          <button class="icon-btn" id="btn-simulate-loading" title="Simulate Network Fetch / Loading Skeleton" aria-label="Simulate Loading State">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>

          <!-- Reset Demo Store -->
          <button class="icon-btn" id="btn-reset-demo" title="Reset Demo Data (Clear LocalStorage)" aria-label="Reset Demo Data">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>

          <!-- Theme Toggle -->
          <button class="icon-btn" id="btn-theme-toggle" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
            <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>

          <!-- Notifications Alert -->
          <button class="icon-btn" id="btn-notifications" title="System Notifications" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="icon-badge-dot"></span>
          </button>
        </div>
      </header>

      <!-- Main Dynamic Content Canvas -->
      <main class="main-content" id="app-content">
        <!-- Rendered dynamically by view controllers -->
      </main>
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
